<style id="lock-css">
:root { --bg: #e9edf1; --card: #fff; --ink: #16202b; --ink2: #465262; --ink3: #6b7583; --line: #d8dee5; --acc: #6a4fb6; --acc2: #563d9c; --bad: #cf4b4b; }

html, body { height: 100%; margin: 0; }

.lk { width: min(420px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 14px 40px rgba(0,0,0,.12); padding: 26px 26px 20px; box-sizing: border-box; }
.lk [hidden] { display: none !important; }
.lk-brand { display: flex; align-items: center; gap: 10px; font: 600 21px 'Literata', Georgia, serif; }
.lk-brand em { color: var(--acc); font-style: italic; font-weight: 500; }
.lk-brand svg { width: 34px; height: 34px; color: var(--acc); }
.lk p { color: var(--ink2); margin: 8px 0 16px; font-size: 13.5px; }
.lk label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); margin-bottom: 6px; }
.lk input[type=password], .lk input[type=text], .lk input[type=email] { width: 100%; box-sizing: border-box; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); font: 600 16px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .06em; padding: 0 12px; outline: none; }
.lk input[type=email] { font: 500 15px 'Be Vietnam Pro', system-ui, sans-serif; letter-spacing: 0; }
.lk input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); }
.lk-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 14px; font-size: 13px; color: var(--ink2); }
.lk-row input { accent-color: var(--acc); }
.lk-step { margin-bottom: 14px; }
.lk-step .lk-row:last-child { margin-bottom: 0; }
.lk-list { margin: 0 0 4px; padding-left: 18px; color: var(--ink); font-size: 13.5px; }
.lk-list li { margin: 2px 0; }
.lk button { width: 100%; height: 44px; border: 0; border-radius: 10px; background: var(--acc); color: #fff; font: 700 14.5px 'Be Vietnam Pro', system-ui, sans-serif; cursor: pointer; }
.lk button:hover { background: var(--acc2); }
.lk button[disabled] { opacity: .6; cursor: progress; }
.lk-err { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 20px; margin-top: 10px; }
.lk-foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink3); }
.lk-show { background: none !important; color: var(--ink3) !important; width: auto !important; height: auto !important; font-size: 12px !important; padding: 0; }
.lk-show:hover { color: var(--acc) !important; }
.lk-retry { margin-left: 4px; text-decoration: underline; }
</style>
