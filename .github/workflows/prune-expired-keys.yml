# Gỡ key truy cập đã hết hạn khỏi app.enc.js (tạo bởi tools/build_locked.py — sửa ở đó)
name: Gỡ key hết hạn
on:
  schedule:
    - cron: '15 17 * * *'   # 00:15 mỗi ngày, giờ Việt Nam
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: prune
        name: Bỏ các key đã hết hạn (luôn giữ lại ít nhất một key)
        run: |
          python3 - <<'PY'
          import json, os, re, time
          s = open('app.enc.js', encoding='utf-8').read()
          m = re.search(r'window\.NA_ENC=(\{.*\});', s, re.S)
          enc = json.loads(m.group(1))
          slots = enc.get('keys', [])
          keep = [k for k in slots if not k.get('exp') or k['exp'] > time.time() * 1000]
          if keep and len(keep) < len(slots):
              enc['keys'] = keep
              open('app.enc.js', 'w', encoding='utf-8').write(s[:m.start(1)] + json.dumps(enc) + s[m.end(1):])
              open(os.environ['GITHUB_OUTPUT'], 'a').write('changed=1\n')
              print('removed', len(slots) - len(keep), 'expired key(s)')
          PY
      - if: steps.prune.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Gỡ key truy cập đã hết hạn"
          git push
      - if: steps.prune.outputs.changed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
